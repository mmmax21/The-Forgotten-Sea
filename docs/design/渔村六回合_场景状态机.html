    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --ink: #e6edf3;
      --ink-soft: #8b949e;

      --c-ruin-bg: #2b2310;
      --c-public-bg: #2e2610;

  .toolbar { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar button, .toolbar label {

  .toolbar input[type=checkbox] { vertical-align: middle; margin-right: 4px; }

  .node rect { stroke-width: 1.4; cursor: grab; }
  .node:active rect { cursor: grabbing; }
  .node text { pointer-events: none; user-select: none; }
  .node .title { font-weight: 600; font-size: 12.5px; }
  .node .sub { font-size: 10.5px; fill: var(--ink-soft); }
  .link { fill: none; stroke: var(--line); stroke-width: 1.2; }
  .link-label { font-size: 10px; fill: var(--ink-soft); pointer-events: none; user-select: none;

  .link.dashed { stroke-dasharray: 5 4; }
  .link.gate { stroke: var(--c-gate); }
  .link.deadline { stroke: var(--danger); }
  .link.highlight { stroke: var(--accent); stroke-width: 2; }

  aside#detail {

  aside#detail dl { margin: 8px 0 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; font-size: 12.5px; }
  aside#detail dt { color: var(--ink-soft); }
  aside#detail dd { margin: 0; }
  aside#detail .close { position: absolute; right: 8px; top: 6px; cursor: pointer; color: var(--ink-soft); }

    meta: { 成本: "1 AP", B: "+60", NPC: "盐嫂 T−20 A+20、知情；永久失去本区协助" } },
  pub_named_e: { tags: ["公开", "实名船匠辨认", "1 AP"],
    meta: { 成本: "1 AP", B: "+60", NPC: "哑伯 T−20 A+20、知情；永久失去本区协助" } },
  apology: { tags: ["缓解", "1 AP", "对被实名者各一次"],
    meta: { 成本: "1 AP", 效果: "T+5 A−10", 注意: "不收回已公开姓名、不降 B、不恢复协助" } },
  d3_known: { tags: ["全局", "第 3 天", "仅一次"],
    meta: { 效果: "当时已知情 NPC 各 A+10", 提示: "之后知情不追补" } },
  hazard: { tags: ["告密条件"],
    meta: { 公式: "知情 ∧ T<60 ∧ A≥60", 提示: "T≥60/A≥60 时只暂停协助，不告密" } },
  warn: { tags: ["预警"],
    meta: { 规则: "首次进入高危 → 期限 N+1；次日仍高危 → 告密" } },
  report: { tags: ["告密"],
    meta: { 处罚: "下一回合 AP−1；渔村来源最多一次；物品不自动没收" } },
  day6: { tags: ["第 6 天", "离场日"],
    meta: { 可做: "补救/记录/保管/交接", 不可: "不能临时补做公开" } },
  end_low:  { tags: ["地区成果"], meta: { 条件: "B<30", 描述: "传闻尚弱" } },
  end_mid:  { tags: ["地区成果"], meta: { 条件: "30≤B<60", 描述: "留下认知火种" } },
  end_high: { tags: ["地区成果"], meta: { 条件: "B≥60", 描述: "出现局部现实变化" } },
};

/* ============== 渲染 ============== */
const svg = document.getElementById("graph");
const detail = document.getElementById("detail");
const dTitle = document.getElementById("dTitle");
const dTags  = document.getElementById("dTags");
const dMeta  = document.getElementById("dMeta");

let width = window.innerWidth, height = window.innerHeight - 52;
window.addEventListener("resize", () => { width = window.innerWidth; height = window.innerHeight - 52; });

const root = d3.select(svg).attr("viewBox", `0 0 ${width} ${height}`);
const g = root.append("g");
const zoom = d3.zoom().scaleExtent([0.3, 3]).on("zoom", ev => g.attr("transform", ev.transform));
root.call(zoom);

// 力模拟
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(110).strength(0.5))
  .force("charge", d3.forceManyBody().strength(-360))
  .force("collide", d3.forceCollide(48))
  .force("center", d3.forceCenter(0, 0))
  .force("y", d3.forceY(d => d.cat === "gate" ? -260 : d.cat === "public" ? 380 : 0).strength(0.04));

// 边
const link = g.append("g").selectAll("path").data(links).join("path")
  .attr("class", d => `link ${d.k === "deadline" ? "dashed deadline" : ""} ${d.k === "gate" ? "gate" : ""}`);
const linkLabel = g.append("g").selectAll("text").data(links).join("text")
  .attr("class", "link-label")
  .attr("text-anchor", "middle")
  .text(d => d.l || "");

// 箭头
root.append("defs").append("marker")
  .attr("id", "arrow").attr("viewBox", "0 -5 10 10")
  .attr("refX", 8).attr("refY", 0).attr("markerWidth", 6).attr("markerHeight", 6)
  .attr("orient", "auto")
  .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", "var(--line)");
link.attr("marker-end", "url(#arrow)");

// 节点
const node = g.append("g").selectAll("g").data(nodes).join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (ev,d) => { if (!ev.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag",  (ev,d) => { d.fx = ev.x; d.fy = ev.y; })
    .on("end",   (ev,d) => { if (!ev.active) sim.alphaTarget(0); })
  )
  .on("click", (ev,d) => showDetail(d))
  .on("mouseover", (ev,d) => highlight(d, true))
  .on("mouseout",  (ev,d) => highlight(d, false));

node.append("rect")
  .attr("rx", 10).attr("ry", 10)
  .attr("width", 130).attr("height", 46).attr("x", -65).attr("y", -23)
  .attr("fill", d => PALETTE[d.cat].bg)
  .attr("stroke", d => PALETTE[d.cat].stroke);

node.append("text").attr("class", "title")
  .attr("text-anchor", "middle").attr("y", -4)
  .text(d => d.title);
node.append("text").attr("class", "sub")
  .attr("text-anchor", "middle").attr("y", 12)
  .text(d => d.sub);

node.append("title").text(d => `${d.title}\n${d.sub}\n类别：${CAT_LABEL[d.cat]}`);

sim.on("tick", () => {
  link.attr("d", d => {
    const x1 = d.source.x, y1 = d.source.y, x2 = d.target.x, y2 = d.target.y;
    const dx = x2 - x1, dy = y2 - y1, dr = Math.hypot(dx, dy) * 1.4;
    return `M${x1},${y1} A${dr},${dr} 0 0,1 ${x2},${y2}`;
  });
  linkLabel
    .attr("x", d => (d.source.x + d.target.x) / 2)
    .attr("y", d => (d.source.y + d.target.y) / 2 - 4);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

// 详情
function showDetail(d) {
  const info = DETAIL[d.id] || { tags: [CAT_LABEL[d.cat]], meta: { 类别: CAT_LABEL[d.cat], 摘要: d.sub } };
  dTitle.textContent = d.title;
  dTags.innerHTML = info.tags.map(t => `<span class="tag">${t}</span>`).join("");
  dMeta.innerHTML = "";
  for (const [k, v] of Object.entries(info.meta)) {
    dMeta.insertAdjacentHTML("beforeend", `<dt>${k}</dt><dd>${v}</dd>`);
  }
  detail.style.display = "block";
}
document.querySelector("#detail .close").onclick = () => detail.style.display = "none";

// 高亮
function highlight(d, on) {
  if (!on) { link.classed("highlight", false); return; }
  const related = new Set([d.id]);
  links.forEach(l => {
    if (l.s.id === d.id || l.t.id === d.id) { related.add(l.s.id); related.add(l.t.id); }
  });
  link.classed("highlight", l => l.s.id === d.id || l.t.id === d.id);
  node.style("opacity", n => related.has(n.id) ? 1 : 0.25);
}
node.on("mouseout", (ev,d) => { highlight(d, false); node.style("opacity", 1); });

// 工具栏
const tLabels = document.getElementById("tLabels");
tLabels.onchange = () => linkLabel.style("display", tLabels.checked ? null : "none");
const tDeadlines = document.getElementById("tDeadlines");
tDeadlines.onchange = () => link.filter(d => d.k === "deadline").style("display", tDeadlines.checked ? null : "none");
const tForce = document.getElementById("tForce");
tForce.onchange = () => {
  if (tForce.checked) sim.alpha(0.6).restart();
  else sim.stop();
};
document.getElementById("bReset").onclick = () => {
  nodes.forEach(n => { n.fx = null; n.fy = null; });
  sim.alpha(1).restart();
  root.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
};
</script>
<script src="https://d3js.org/d3.v7.min.js"></script>
</body>
</html>
